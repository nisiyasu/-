<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 280" fill="none">
  <defs>
    <filter id="rough" x="-25%" y="-35%" width="150%" height="170%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018 0.065" numOctaves="2" seed="17" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="7" xChannelSelector="R" yChannelSelector="G" result="distorted"/>
      <feGaussianBlur in="distorted" stdDeviation="1.3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="distorted"/></feMerge>
    </filter>
    <filter id="glowPink" x="-35%" y="-60%" width="170%" height="220%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feFlood flood-color="#ff008f" flood-opacity=".9"/>
      <feComposite in2="b" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowLime" x="-35%" y="-60%" width="170%" height="220%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feFlood flood-color="#caff00" flood-opacity=".95"/>
      <feComposite in2="b" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="edge" x1="40" y1="35" x2="600" y2="248" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ff008f"/><stop offset=".47" stop-color="#ff008f"/><stop offset=".5" stop-color="#14e8ff"/><stop offset=".77" stop-color="#caff00"/><stop offset="1" stop-color="#ffd400"/>
    </linearGradient>
  </defs>
  <rect x="30" y="25" width="580" height="230" rx="40" stroke="#ff008f" stroke-width="14" stroke-linecap="round" opacity=".95" filter="url(#glowPink)"/>
  <rect x="44" y="39" width="552" height="202" rx="31" stroke="#caff00" stroke-width="7" stroke-linecap="round" opacity=".95" filter="url(#glowLime)"/>
  <rect x="55" y="50" width="530" height="180" rx="26" stroke="url(#edge)" stroke-width="3" stroke-dasharray="58 17 13 11" opacity=".9" filter="url(#rough)"/>
  <path d="M17 89C74 61 103 67 157 47M500 239c56-3 89-23 126-53M26 201c53 17 76 17 117 9M485 33c50 5 76 14 128 37" stroke="#14e8ff" stroke-width="5" stroke-linecap="round" opacity=".7" filter="url(#rough)"/>
  <path d="M72 18l73 16m342 229 78-19M18 145l71-6m462-7 72 11" stroke="#fff" stroke-width="2.5" stroke-linecap="round" opacity=".45"/>
</svg>
