<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#050507">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Life Command Center · RIOT NEON</title>
  <link rel="stylesheet" href="./app.css?v=20260807v2">
  <link rel="stylesheet" href="./app-overrides.css?v=20260807v3">
</head>
<body>
  <div id="app" class="app-shell">
    <main>
      <section id="homeView" class="view active" aria-label="ホーム">
        <div class="poster home-poster" id="homePoster">
          <img id="homeSkin" alt="Life Command Center RIOT NEON ホーム">
          <div class="command-hotspots" aria-label="今日の7コマンド">
            <button class="command-hit c1" data-command="瞑想" aria-label="瞑想"></button>
            <button class="command-hit c2" data-command="イメージング" aria-label="イメージング"></button>
            <button class="command-hit c3" data-command="アファメーション" aria-label="アファメーション"></button>
            <button class="command-hit c4" data-command="リーディング" aria-label="リーディング"></button>
            <button class="command-hit c5" data-command="ジャーナリング" aria-label="ジャーナリング"></button>
            <button class="command-hit c6" data-command="エクササイズ" aria-label="エクササイズ"></button>
            <button class="command-hit c7" data-command="BTC1チャット" aria-label="BTC1チャット"></button>
          </div>
        </div>
      </section>

      <section id="savedView" class="view" aria-label="保存リスト">
        <div class="saved-page">
          <div id="savedHero" class="saved-hero" role="img" aria-label="RIOT NEON 保存リスト"></div>
          <section class="saved-controls" aria-label="保存リスト操作">
            <div class="search-row">
              <label class="search-box">
                <span class="search-icon">⌕</span>
                <input id="searchInput" type="search" autocomplete="off" placeholder="キーワードで検索する" aria-label="保存リストを検索">
              </label>
              <button id="filterFocus" class="neon-btn neon-yellow" type="button">絞り込み</button>
            </div>
            <div id="categoryBar" class="category-row" role="group" aria-label="カテゴリ">
              <button class="chip active" data-category="ALL">ALL</button>
              <button class="chip" data-category="日記">日記</button>
              <button class="chip" data-category="ルール">ルール</button>
              <button class="chip" data-category="気付き">気付き</button>
              <button class="chip" data-category="その他">その他</button>
            </div>
            <div class="mode-grid">
              <fieldset class="mode-group">
                <legend>表示モード</legend>
                <div class="segmented">
                  <button id="cardModeBtn" class="seg active" data-viewmode="card">▦ カード表示</button>
                  <button id="listModeBtn" class="seg" data-viewmode="list">☷ 一覧表示</button>
                </div>
              </fieldset>
              <fieldset class="mode-group">
                <legend>タイトルモード</legend>
                <div class="segmented">
                  <button id="organizedBtn" class="seg" data-titlemode="organized">☷ 整理タイトル</button>
                  <button id="originalBtn" class="seg active" data-titlemode="original">✎ 俺の原文</button>
                </div>
              </fieldset>
            </div>
            <div class="utility-row">
              <label class="sort-wrap"><span>並び替え</span><select id="sortSelect"><option value="newest">新しい順</option></select></label>
              <div class="sync-wrap"><span id="syncStatus">最終同期 --:--</span><button id="refreshBtn" class="neon-btn neon-lime" type="button">↻ 更新する</button></div>
            </div>
          </section>
          <section class="saved-summary" aria-live="polite"><span id="resultCount">0件</span><span id="activeSummary">ALL / 俺の原文</span></section>
          <section id="savedList" class="saved-list card-mode" aria-label="保存項目"></section>
          <div id="emptyState" class="empty-state hidden"><strong>NO MATCH</strong><span>条件に合う保存項目はありません。</span></div>
        </div>
      </section>
    </main>

    <nav class="bottom-nav" aria-label="メインナビゲーション">
      <button class="nav-btn active" data-view="homeView" aria-current="page"><span class="nav-icon">⚡</span><span>ホーム</span></button>
      <button class="nav-btn" data-view="savedView"><span class="nav-icon">▣</span><span>保存リスト</span></button>
    </nav>

    <div id="commandToast" class="command-toast" role="status" aria-live="polite"></div>
    <div id="detailModal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="detailTitle">
      <div class="modal-backdrop" data-close-modal></div>
      <article class="detail-panel">
        <button class="modal-close" data-close-modal aria-label="閉じる">×</button>
        <div id="detailCategory" class="detail-category"></div>
        <h2 id="detailTitle"></h2>
        <div class="detail-meta" id="detailMeta"></div>
        <section class="detail-block"><h3>俺の原文</h3><p id="detailOriginal"></p></section>
        <section class="detail-block"><h3>整理版</h3><p id="detailBody"></p></section>
      </article>
    </div>
  </div>

  <script src="./assets/runtime/home_00.js"></script>
  <script src="./assets/runtime/home_01.js"></script>
  <script src="./assets/runtime/home_02.js"></script>
  <script src="./assets/runtime/home_03.js"></script>
  <script src="./assets/runtime/home_04.js"></script>
  <script src="./assets/runtime/home_05.js"></script>

  <script src="./assets/runtime/savehero_00.js"></script>
  <script src="./assets/runtime/savehero_01.js"></script>
  <script src="./assets/runtime/savehero_02.js"></script>
  <script src="./assets/runtime/savehero_03.js"></script>

  <script src="./assets/runtime/icon_diary.js"></script>
  <script src="./assets/runtime/icon_insight.js"></script>
  <script src="./assets/runtime/icon_rule.js"></script>
  <script src="./assets/runtime/icon_other.js"></script>
  <script src="./assets/runtime/card_texture.js"></script>
  <script src="./assets/runtime/brush_lime.js"></script>
  <script src="./assets/runtime/assets-init.js"></script>
  <script src="./app.js?v=20260807v3"></script>
</body>
</html>
